<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>3D Simulátor (Bez AR) - Astronaut</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <!-- Obyčejná 3D scéna (bez AR.js) -->
    <a-scene renderer="colorManagement: true; physicallyCorrectLights: true;" background="color: #1a1a2e">
      
      <a-assets>
        <a-asset-item id="astronaut" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"></a-asset-item>
      </a-assets>

      <!-- Osvětlení -->
      <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="2" position="-1 2 1"></a-light>

      <!-- Kamera s možností otáčení myší -->
      <a-entity camera look-controls orbit-controls="target: 0 1 0; minDistance: 0.5; maxDistance: 5; initialPosition: 0 1.5 2"></a-entity>

      <!-- Podlaha (aby stál na zemi) -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#333344"></a-plane>

      <!-- 3D Model Astronauta -->
      <!-- Pozice trochu upravená, aby stál na podlaze -->
      <a-entity 
        gltf-model="#astronaut" 
        scale="0.2 0.2 0.2" 
        position="0 0 0" 
        animation-mixer="loop: repeat">
      </a-entity>

      <a-entity position="0 2 -2" text="value: 3D Simulator (Tazte mysi pro otaceni); align: center; width: 4; color: #00ffcc"></a-entity>
    </a-scene>
  </body>
</html>
