<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>AR Datový tok - Informatika</title>
    <!-- Zahrnutí A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Zahrnutí AR.js pro A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Marker (přednastavený Hiro marker) -->
      <a-marker preset="hiro">
        
        <!-- Základní deska (Motherboard base) -->
        <a-box position="0 0 0" width="3" height="0.1" depth="3" color="#1a2f4c"></a-box>
        
        <!-- Procesor (CPU core) uprostřed -->
        <a-box position="0 0.1 0" width="1" height="0.2" depth="1" color="#4287f5"
               animation="property: material.color; type: color; to: #ff4da6; dur: 1000; loop: true; dir: alternate">
        </a-box>

        <!-- CPU Piny (okolo) -->
        <a-torus position="0 0.1 0" radius="0.8" radius-tubular="0.02" color="#00ffcc" rotation="90 0 0"
                 animation="property: rotation; to: 90 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <!-- Data packety letící po sběrnici (X osa) -->
        <a-sphere position="-1.5 0.2 0" radius="0.1" color="#ffff00"
                  animation="property: position; from: -1.5 0.2 0; to: 0 0.2 0; loop: true; dur: 1000; easing: linear">
        </a-sphere>
        <a-sphere position="1.5 0.2 0" radius="0.1" color="#ffff00"
                  animation="property: position; from: 1.5 0.2 0; to: 0 0.2 0; loop: true; dur: 1000; easing: linear">
        </a-sphere>

        <!-- Data packety letící po sběrnici (Z osa) -->
        <a-sphere position="0 0.2 -1.5" radius="0.1" color="#00ffcc"
                  animation="property: position; from: 0 0.2 -1.5; to: 0 0.2 0; loop: true; dur: 800; easing: linear">
        </a-sphere>
        <a-sphere position="0 0.2 1.5" radius="0.1" color="#00ffcc"
                  animation="property: position; from: 0 0.2 1.5; to: 0 0.2 0; loop: true; dur: 800; easing: linear">
        </a-sphere>

        <!-- Vznášející se text -->
        <a-entity position="0 1 -1" rotation="-45 0 0" scale="2 2 2" text="value: CPU CORE ACTIVE; color: #00ffcc; align: center; font: kelsonsans;"
                  animation="property: position; from: 0 1 -1; to: 0 1.2 -1; loop: true; dir: alternate; dur: 1500"></a-entity>
        
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
