<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>AR Astronaut - Informatika</title>
    <!-- Zahrnutí A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Zahrnutí AR.js pro A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- Zahrnutí A-Frame Extras pro přehrávání GLTF animací -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- Scéna: Zakážeme logování AR.js pro čistší konzoli a nastavíme osvětlení -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
      renderer="colorManagement: true; physicallyCorrectLights: true;"
    >
      
      <!-- Načtení externích realistických 3D modelů (z CDN) -->
      <a-assets>
        <!-- Ikonický model Astronauta s vysokým rozlišením -->
        <a-asset-item id="astronaut" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"></a-asset-item>
      </a-assets>

      <!-- Reálné osvětlení, aby model vypadal uvěřitelně na stole -->
      <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="2" position="-1 2 1"></a-light>

      <!-- Marker (přednastavený Hiro marker) -->
      <a-marker preset="hiro">
        
        <!-- GLTF Model umístěný na markeru. 
             Scale: zmenšeno aby se vešel na papír.
             animation-mixer: spustí animace uložené uvnitř modelu. 
             Rotace bývá potřeba mírně upravit, aby stál kolmo. -->
        <a-entity 
          gltf-model="#astronaut" 
          scale="0.2 0.2 0.2" 
          position="0 0 0" 
          rotation="-90 0 0" 
          animation-mixer="loop: repeat"
          shadow="cast: true; receive: false">
        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
